name: ardan-pr-review

on:
  pull_request:
    paths:
      - ".agents/skills/ardan-pr-review/**"
      - "zarf/tests/ardan-pr-review/**"
      - "Makefile"
      - ".github/workflows/ardan-pr-review.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/ardan-pr-review/**"
      - "zarf/tests/ardan-pr-review/**"
      - "Makefile"
      - ".github/workflows/ardan-pr-review.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint

  # Stub analyzers with the runner's own shell tools: GNU on Linux, BSD on macOS.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ripgrep, jq, PowerShell
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y ripgrep jq
          else
            brew install ripgrep jq
          fi
          command -v pwsh >/dev/null || brew install --cask powershell
      - run: make test-pr-review-host

  # Real analyzers at the versions pinned in zarf/tests/ardan-pr-review/Dockerfile.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: zarf/tests/ardan-pr-review
          load: true
          tags: ardan-pr-review-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make test-pr-review-container
        env:
          IMAGE: ardan-pr-review-tools:ci
          NO_BUILD: "1"
